documentation:
  - changed-files:
      - all-globs-to-all-files:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
          - "CODE_OF_CONDUCT.md"
          - "SECURITY.md"

ci/cd:
  - changed-files:
      - all-globs-to-all-files:
          - ".github/workflows/**"

dependencies:
  - changed-files:
      - all-globs-to-all-files:
          - "go.mod"
          - "go.sum"

cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/**"
          - "main.go"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/config/**"
          - "examples/config/**"

doctor:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/stevedore/doctor.go"
          - "cmd/stevedore/doctor_test.go"
          - "internal/doctor/**"

manifests:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/manifest/**"
          - "examples/apps/**"

reconciler:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/reconciler/**"
          - "cmd/stevedore/run.go"
          - "cmd/stevedore/run_test.go"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/docker/**"

git:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/git/**"

exposure:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/exposure/**"

secrets:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/secrets/**"
          - "examples/config/secrets.local.yml"
