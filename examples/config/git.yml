# Stevedore agent configuration (git source of truth)
#
# Loaded once at startup. Precedence: ENV overrides > these file values > defaults.
#
# The active source is inferred from which node is present under `source`
# (define exactly one of `local` or `git`). Likewise, the git auth method is
# inferred from which node is present under `source.git.auth` (define at most
# one of `token`, `basic`, or `ssh`; omit entirely for public repos).
#
# Use token auth for GitHub. For providers that require basic auth, such as
# Bitbucket, you can usually place the token in the password field.
#
# Secrets support ${ENV_VAR} interpolation so they can be injected at runtime
# instead of being stored in plaintext.

logging:
  dir: /var/log/stevedore
  debug: false

source:
  git:
    url: https://github.com/your-org/your-apps-repo.git
    branch: main
    auth:
      token:
        value: ${GIT_TOKEN}
      # basic:
      #   username: ${GIT_USERNAME}
      #   password: ${GIT_TOKEN}


poll:
  interval: 60s

# Exposure providers are optional — configure only the providers used by your apps.
# exposure:
#   apache:
#     # Required when any app sets expose.provider: apache.
#     # Overridable by STEVEDORE_APACHE_SITES_DIR.
#     sitesDir: /etc/apache2/sites-enabled
