image:
  repository: nginx
  tag: 1.31.3
container:
  name: demo-api
restartPolicy: always
ports:
  - name: http
    containerPort: 80
    hostPort: 8081
environment:
  NGINX_ENTRYPOINT_QUIET_LOGS: "1"
  TOKEN_VALUE_SECRET: ${local:api/token}
volumes:
  - name: data
    hostPath: /var/lib/stevedore/demo-api/data
    mountPath: /srv/data
  - name: cache
    hostPath: /var/lib/stevedore/demo-api/cache
    mountPath: /srv/cache
networks:
  - name: demo         # first declared entry is used as the primary network
  - name: demo-shared  # additional network attachment
expose:
  enabled: true
  provider: apache
  config:
    domain: demo-api.example.com   # required: public hostname Apache will serve
    ssl: false                     # set to true to enable HTTPS via Let's Encrypt
    # email: ops@example.com       # required when ssl: true  (Let's Encrypt account)
    # webroot: /var/www/letsencrypt  # optional: ACME challenge directory (default shown)
    # port: 8081                   # optional: override proxy target port (defaults to first hostPort)
