image:
  repository: nginx
  tag: 1.31.3
container:
  name: demo-api
restartPolicy: always
ports:
  - name: http
    containerPort: 80
    hostPort: 8081
environment:
  NGINX_ENTRYPOINT_QUIET_LOGS: "52"
  TOKEN_VALUE_SECRET: ${local:api/token}
network:
  name: demo # The apps don't need to be on the same network
expose:
  enabled: true # I think this is implied if you specify it - why is it needed?
  provider: apache
  config:
    domain: demo-api.local
    ssl: false
