# Stevedore agent configuration (local source of truth)
#
# Loaded once at startup. Precedence: ENV overrides > these file values > defaults.
# Config location resolution:
#   1. STEVEDORE_HOME env var (directory, file is <home>/config.yml)
#   2. /etc/stevedore/config.yml (default)
#
# The active source is inferred from which node is present under `source`.
# Define exactly one of `local` or `git`.

logging:
  # Directory for stevedore.log. Overridable by STEVEDORE_LOG_DIR.
  dir: /Users/username/workspace/general/stevedore-agent/.home/log
  # Verbose logging. Overridable by STEVEDORE_DEBUG.
  debug: true

source:
  local:
    # Directory that contains an apps/ folder with <app>/stevedore.yml manifests.
    path: /Users/username/workspace/general/stevedore-agent/.home/setup

poll:
  # How often to check the source of truth for changes. Overridable by STEVEDORE_POLL_INTERVAL.
  interval: 30s

# Exposure providers are optional. Configure only the providers used by your apps.
# exposure:
#   apache:
#     # Required when any app uses expose.provider: apache.
#     # Overridable by STEVEDORE_APACHE_SITES_DIR.
#     sitesDir: /etc/apache2/sites-enabled

secrets:
  providers:
    local:
      file: ./secrets.local.yml
